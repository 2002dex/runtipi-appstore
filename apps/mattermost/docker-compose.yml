x-runtipi:
  schema_version: 2
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    read_only: true
    volumes:
      - ${APP_DATA_DIR}/db:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - POSTGRES_USER=mmuser
      - POSTGRES_PASSWORD=mmuser_password
      - POSTGRES_DB=mattermost
    networks:
      - tipi_main_network
  mattermost:
    image: ngrie/mattermost-team-edition-arm:10.11.2
    restart: unless-stopped
    x-runtipi:
      internal_port: 8065
      is_main: true
    depends_on:
      - postgres
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    read_only: false
    volumes:
      - ${APP_DATA_DIR}/mattermost/config:/mattermost/config:rw
      - ${APP_DATA_DIR}/mattermost/data:/mattermost/data:rw
      - ${APP_DATA_DIR}/mattermost/logs:/mattermost/logs:rw
      - ${APP_DATA_DIR}/mattermost/plugins:/mattermost/plugins:rw
      - ${APP_DATA_DIR}/mattermost/client/plugins:/mattermost/client/plugins:rw
      - ${APP_DATA_DIR}/mattermost/bleve-indexes:/mattermost/bleve-indexes:rw
    tmpfs:
      - /tmp
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      - MM_BLEVESETTINGS_INDEXDIR=/mattermost/bleve-indexes
      - MM_SERVICESETTINGS_SITEURL=https://${APP_DOMAIN}
      - MM_SERVICESETTINGS_TRUSTEDPROXYIPHEADER=X-Forwarded-For
      - MM_SERVICESETTINGS_ALLOWCORSFROM=*
      - MM_LOGSETTINGS_ENABLEDIAGNOSTICS=false
      - MM_PLUGINSETTINGS_ENABLEUPLOADS=true
    user: "0:0"
    entrypoint:
    - /bin/bash
    - -c
    - |
        set -e

        echo "Fixing Mattermost volume ownership..."

        chown -R 2000:2000 /mattermost/config \
                           /mattermost/data \
                           /mattermost/logs \
                           /mattermost/plugins \
                           /mattermost/client/plugins \
                           /mattermost/bleve-indexes

        echo "Starting Mattermost as UID 2000..."

        exec su-exec 2000:2000 /mattermost/bin/mattermost server
    networks:
      - tipi_main_network