services:
  web:
    image: ghcr.io/jitsi/web:stable-11146-1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    volumes:
      - ${APP_DATA_DIR}/web/config:/config
      - ${APP_DATA_DIR}/web/storage:/storage
      - ${APP_DATA_DIR}/web/transcripts:/usr/share/jitsi-meet/transcripts:ro
      - ${APP_DATA_DIR}/web/tmp-crontabs:/var/spool/cron/crontabs
      - ${APP_DATA_DIR}/web/tmp-load-test:/usr/share/jitsi-meet/load-test
    environment:
      TZ: ${TZ}
      PUBLIC_URL: ${APP_PROTOCOL}://${APP_DOMAIN}

      # Traefik terminates TLS; Jitsi web serves plain HTTP internally.
      DISABLE_HTTPS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_LETSENCRYPT: "0"
      HTTP_PORT: "8000"
      HTTPS_PORT: "8443"

      # Core XMPP settings.
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_HIDDEN_DOMAIN: hidden.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      XMPP_PORT: "5222"
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      XMPP_WEBSOCKET_URL: wss://${APP_DOMAIN}/xmpp-websocket

      AUTH_TYPE: internal
      ENABLE_AUTH: "0"
      ENABLE_GUESTS: "1"
      ENABLE_LOBBY: "1"
      ENABLE_PREJOIN_PAGE: "1"
      ENABLE_P2P: "1"
      ENABLE_XMPP_WEBSOCKET: "1"
      ENABLE_IPV6: "1"

      # Common Jitsi defaults.
      XMPP_SERVER: xmpp.meet.jitsi
      JVB_BREWERY_MUC: jvbbrewery
      JICOFO_AUTH_USER: focus
      JVB_AUTH_USER: jvb
    depends_on:
      - jvb
    networks:
      - meet.jitsi
    x-runtipi:
      is_main: true
      internal_port: 8000

  prosody:
    image: ghcr.io/jitsi/prosody:stable-11146-1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    volumes:
      - ${APP_DATA_DIR}/prosody/config:/config
      - ${APP_DATA_DIR}/prosody/prosody-plugins-custom:/prosody-plugins-custom
      - ${APP_DATA_DIR}/prosody/storage:/var/lib/prosody
    environment:
      TZ: ${TZ}
      PUBLIC_URL: ${APP_PROTOCOL}://${APP_DOMAIN}

      AUTH_TYPE: internal
      ENABLE_AUTH: "0"
      ENABLE_GUESTS: "1"
      ENABLE_LOBBY: "1"
      ENABLE_XMPP_WEBSOCKET: "1"
      ENABLE_IPV6: "1"

      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_HIDDEN_DOMAIN: hidden.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      XMPP_SERVER_S2S_PORT: "5269"
      PROSODY_HTTP_PORT: "5280"

      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET}

      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_BREWERY_MUC: jvbbrewery
    networks:
      meet.jitsi:
        aliases:
          - xmpp.meet.jitsi

  jicofo:
    image: ghcr.io/jitsi/jicofo:stable-11146-1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    volumes:
      - ${APP_DATA_DIR}/jicofo:/config
    environment:
      TZ: ${TZ}
      AUTH_TYPE: internal
      ENABLE_AUTH: "0"
      ENABLE_AUTO_OWNER: "1"
      ENABLE_AUTO_LOGIN: "1"
      ENABLE_IPV6: "1"

      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_HIDDEN_DOMAIN: hidden.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_PORT: "5222"

      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET}
      JICOFO_BREWERY_MUC: jicofo
      JVB_BREWERY_MUC: jvbbrewery
    depends_on:
      - prosody
    networks:
      - meet.jitsi

  jvb:
    image: ghcr.io/jitsi/jvb:stable-11146-1
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run:size=16M,mode=1750,exec
      - /tmp:size=16M,mode=1777,noexec
    ports:
      - "10000:10000/udp"
    volumes:
      - ${APP_DATA_DIR}/jvb:/config
    environment:
      TZ: ${TZ}
      ENABLE_JVB_XMPP_SERVER: "true"
      ENABLE_IPV6: "1"

      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_SERVER: xmpp.meet.jitsi
      XMPP_PORT: "5222"

      JVB_XMPP_SERVER: xmpp.meet.jitsi
      JVB_XMPP_AUTH_DOMAIN: auth.meet.jitsi
      JVB_XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      JVB_XMPP_PORT: "5222"
      
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_BREWERY_MUC: jvbbrewery
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS}
      JVB_PORT: "10000"
    depends_on:
      - prosody
    networks:
      - meet.jitsi

networks:
  meet.jitsi:

x-runtipi:
  schema_version: 2
