version: '3.7'
services:
  urbackup:
    image: dspworks/urbackup-server:arm64-zfs
    container_name: urbackup
    privileged: true
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ:-Asia/Kolkata}
      - ZFS_IMAGE=mypool/urbackup/images
      - ZFS_FILES=mypool/urbackup/files
    volumes:
      - /mnt/urbackup/database:/var/urbackup
      - /mnt/urbackup/settings:/etc/urbackup
      - /mnt/urbackup:/mnt/urbackup
    devices:
      - /dev/zfs:/dev/zfs
    ports:
      - "55413:55413"
      - "55414:55414"
      - "55415:55415"
      - "35623:35623/udp"
    labels:
      # Main
      traefik.enable: true
      traefik.http.middlewares.urbackup-web-redirect.redirectscheme.scheme: https
      traefik.http.services.urbackup.loadbalancer.server.port: 55414
      # Web
      traefik.http.routers.urbackup-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.urbackup-insecure.entrypoints: web
      traefik.http.routers.urbackup-insecure.service: urbackup
      traefik.http.routers.urbackup-insecure.middlewares: urbackup-web-redirect
      # Websecure
      traefik.http.routers.urbackup.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.urbackup.entrypoints: websecure
      traefik.http.routers.urbackup.service: urbackup
      traefik.http.routers.urbackup.tls.certresolver: myresolver
      # Local domain
      traefik.http.routers.urbackup-local-insecure.rule: Host(`urbackup.${LOCAL_DOMAIN}`)
      traefik.http.routers.urbackup-local-insecure.entrypoints: web
      traefik.http.routers.urbackup-local-insecure.service: urbackup
      traefik.http.routers.urbackup-local-insecure.middlewares: urbackup-web-redirect
      # Local domain secure
      traefik.http.routers.urbackup-local.rule: Host(`urbackup.${LOCAL_DOMAIN}`)
      traefik.http.routers.urbackup-local.entrypoints: websecure
      traefik.http.routers.urbackup-local.service: urbackup
      traefik.http.routers.urbackup-local.tls: true
      runtipi.managed: true