version: '3.7'
services:
  urbackup:
    image: dspworks/urbackup-server:arm64-zfs
    container_name: urbackup
    privileged: true
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - TZ=Asia/Kolkata
      - ZFS_IMAGE=mypool/urbackup/images
      - ZFS_FILES=mypool/urbackup/files
    volumes:
      - /mnt/urbackup/database:/var/urbackup
      - /mnt/urbackup/settings:/etc/urbackup
      - /mnt/urbackup:/mnt/urbackup:rshared
    devices:
      - /dev/zfs:/dev/zfs
    ports:
      - "55413:55413"
      - "55414:55414"
      - "55415:55415"
      - "35623:35623/udp"