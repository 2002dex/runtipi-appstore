persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

# Standard MQTT listener (local network - anonymous allowed for internal docker network)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# TLS MQTT listener (if certificates are available)
listener 8883 0.0.0.0
cafile /mosquitto/config/ca.crt
certfile /mosquitto/config/server.crt
keyfile /mosquitto/config/server.key
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# --- Bridge to Cloud Broker ---
connection cloud_bridge
address vibesmarthome.net:8883
remote_username Vibe_Admin
remote_password Vibe@mqtt1256

# Enable SSL/TLS for the bridge connection
bridge_capath /etc/ssl/certs/

# Share specific gateway_id topics bidirectionally between local and cloud
topic vibegateway_pub/# both 0
topic vibegateway_sub/# both 0

# Bridge HA MQTT discovery and status topics to cloud broker
topic homeassistant/# both 0
topic gateway/status/# both 0
topic vibegateway_ha/# both 0